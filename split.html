
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13273a">
  <title>JF Training — Split prise de masse</title>
  <link rel="icon" href="./icon-192.png">
  <style>
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      color: #142337;
      background: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      background: #13273a;
      color: white;
      padding: 20px 16px;
    }
    main {
      max-width: 690px;
      margin: auto;
      padding: 12px 12px 80px;
    }
    .card {
      background: white;
      border: 1px solid #dbe4ee;
      border-radius: 14px;
      padding: 14px;
      margin: 10px 0;
      box-shadow: 0 2px 8px #1231;
    }
    h1 { margin: 0; font-size: 23px; }
    h2 { font-size: 20px; }
    .small { font-size: 12px; color: #52667d; }
    .button {
      display: inline-block;
      background: #173e61;
      color: white;
      border: 0;
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .ghost { background: #edf3f9; color: #173e61; }
    .row {
      display: grid;
      grid-template-columns: 28px 1fr 1fr 40px;
      gap: 7px;
      align-items: center;
      margin: 8px 0;
    }
    .row input:not([type=checkbox]) {
      width: 100%;
      padding: 9px 4px;
      border: 1px solid #cbd6e2;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
    }
    .row input[type=checkbox] {
      width: 23px;
      height: 23px;
      accent-color: #147c66;
    }
    .exercise {
      border-top: 1px solid #e1e8f0;
      padding-top: 13px;
      margin-top: 13px;
    }
    .exercise h3 { font-size: 16px; margin: 0 0 4px; }
    .previous {
      background: #fff8e9;
      border: 1px solid #e7c98d;
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0;
      font-size: 13px;
      line-height: 1.7;
    }
    .note {
      background: #f0f6ff;
      border-left: 3px solid #4076a3;
      padding: 8px 10px;
      border-radius: 5px;
      font-size: 13px;
      margin-top: 8px;
    }
    .progress {
      height: 9px;
      background: #e3eaf1;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress div {
      height: 100%;
      background: #17816d;
      width: 0;
    }
    .test {
      border: 1px solid #f3ca8a;
      background: #fff9ee;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    select, input {
      font-family: inherit;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div style="max-width:690px;margin:auto">
      <h1 style="display:flex;align-items:center;gap:12px">
        <img src="./icon-192.png" alt="Logo JF Training"
             width="52" height="52"
             style="border-radius:10px">
        JF Training
      </h1>
      <div style="opacity:.85;font-size:13px">
        Programme 2 · Split prise de masse · 12 semaines
      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <a class="button ghost" href="./index.html">
        ← Programme 1 · Haut / Bas
      </a>
      <p class="small">
        Programme Split indépendant. Tes résultats sont
        enregistrés séparément du programme Haut / Bas.
      </p>
    </div>

    <div id="split-mount"></div>
  </main>

  <script>
    /*
      Préparation des éléments attendus par split.js,
      sans exécuter le programme original.
    */
    window.safeGet = function (key) {
      try { return localStorage.getItem(key); }
      catch (e) { return null; }
    };
    window.safeSet = function (key, value) {
      try { localStorage.setItem(key, value); }
      catch (e) {}
    };
  </script>

  <script src="./split.js"></script>
  
<a href="./index.html" style="position:fixed;bottom:15px;right:15px;background:#147c66;color:white;padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:bold;z-index:9999;box-shadow:0 3px 12px #0003">🏋️ Programme 1</a>

</body>
</html>
